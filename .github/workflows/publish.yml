name: Publish

# Push a PEP 440 tag (e.g. v0.2.0rc1, v0.2.0) to release.
# The tag must match `version` in packages/pow-cli/pyproject.toml exactly.
#
# TestPyPI publishes automatically; PyPI waits on the `pypi` environment's
# required reviewers. Both indexes use Trusted Publishing (OIDC) — no tokens.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      # Runs before checkout so an unauthorized tag push does nothing at all.
      # `actor` is who pushed the tag; `triggering_actor` is who re-ran the
      # workflow, if it was re-run. Both must be the maintainer.
      - name: Authorize releaser
        env:
          RELEASER: bemunin
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
            if [ "${who,,}" != "$RELEASER" ]; then
              echo "::error::Only $RELEASER may publish pow-cli (got '$who')."
              exit 1
            fi
          done
          echo "Release authorized for $ACTOR"

      # Actions are pinned to commit SHAs so a repointed upstream tag cannot
      # change what runs in this workflow. Refresh the SHAs when bumping.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing after checkout needs the token; keep it out of .git/config
          # while the build backend runs.
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Check tag against pyproject version
        id: guard
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              sys.exit(f"::error::Tag {tag!r} must start with 'v'.")
          version = tag[1:]

          # Canonical PEP 440: 1.2.3, 1.2.3a1, 1.2.3b2, 1.2.3rc1.
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?", version):
              sys.exit(
                  f"::error::Tag {tag!r} is not a PEP 440 version. "
                  "Use vX.Y.Z or vX.Y.Z{a,b,rc}N (e.g. v0.2.0rc1, not v0.2.0-rc.1)."
              )

          def project_version(path):
              with open(path, "rb") as f:
                  return tomllib.load(f)["project"]["version"]

          pkg = project_version("packages/pow-cli/pyproject.toml")
          if pkg != version:
              sys.exit(
                  f"::error::Tag {tag!r} says {version}, but "
                  f"packages/pow-cli/pyproject.toml says {pkg}."
              )

          # The workspace root is virtual (never published), so a drift here is
          # only worth a warning.
          root = project_version("pyproject.toml")
          if root != version:
              print(f"::warning::Root pyproject.toml is {root}, expected {version}.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
          print(f"Releasing pow-cli {version}")
          PY

      - name: Build
        run: uv build --package pow-cli --out-dir dist

      - name: Check metadata
        run: uvx twine@6.2.0 check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishes the artifacts built above, unchanged, so both indexes get
  # byte-identical files.
  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running a release whose TestPyPI upload already landed must not
          # block the PyPI job.
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # No skip-existing: a duplicate version on PyPI should fail loudly.
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
