name: Publish

# Publishing a GitHub release (done manually in the web UI) uploads pow-cli to
# TestPyPI automatically, then to PyPI once the `pypi` environment's required
# reviewer approves. Both indexes use Trusted Publishing (OIDC) — no tokens.
#
# The release tag must be canonical PEP 440 with a leading `v` (e.g. v0.2.0rc1,
# v0.2.0) and match `version` in packages/pow-cli/pyproject.toml exactly.
#
# Actions are pinned to commit SHAs so a repointed upstream tag cannot change
# what runs here. Refresh the SHAs when bumping versions.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    # Only this repo (never a fork) and only the maintainer may publish.
    # actor = who published the release; triggering_actor = who re-ran the run.
    if: >-
      github.repository == 'isaac-powerpack/pow' &&
      github.actor == 'bemunin' &&
      github.triggering_actor == 'bemunin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing after checkout needs the token; keep it out of .git/config
          # while the build backend runs.
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Check release tag against pyproject version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib

          tag = os.environ["TAG"]
          # Canonical PEP 440 after the `v`: 1.2.3, 1.2.3a1, 1.2.3b2, 1.2.3rc1.
          m = re.fullmatch(r"v(\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?)", tag)
          if not m:
              sys.exit(
                  f"::error::Tag {tag!r} is not vX.Y.Z or vX.Y.Z{{a,b,rc}}N "
                  "(e.g. v0.2.0rc1, not v0.2.0-rc.1)."
              )
          version = m.group(1)

          def project_version(path):
              with open(path, "rb") as f:
                  return tomllib.load(f)["project"]["version"]

          pkg = project_version("packages/pow-cli/pyproject.toml")
          if pkg != version:
              sys.exit(
                  f"::error::Tag {tag!r} says {version}, but "
                  f"packages/pow-cli/pyproject.toml says {pkg}."
              )

          # The workspace root is virtual (never published), so a drift here is
          # only worth a warning.
          root = project_version("pyproject.toml")
          if root != version:
              print(f"::warning::Root pyproject.toml is {root}, expected {version}.")

          print(f"Releasing pow-cli {version}")
          PY

      - name: Build
        run: uv build --package pow-cli --out-dir dist

      - name: Check metadata
        run: uvx twine@6.2.0 check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Both publish jobs upload the artifacts built above, unchanged, so the two
  # indexes get byte-identical files.
  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running a release whose TestPyPI upload already landed must not
          # block the PyPI job.
          skip-existing: true

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # No skip-existing: a duplicate version on PyPI should fail loudly.
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
